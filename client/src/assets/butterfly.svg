<svg width="420" height="420" viewBox="0 0 420 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wing" x1="90" y1="45" x2="330" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E5FF8A" stop-opacity=".98"/>
      <stop offset=".42" stop-color="#7DDE21" stop-opacity=".98"/>
      <stop offset="1" stop-color="#087A35" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="edge" x1="120" y1="40" x2="315" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B9FF35"/>
      <stop offset="1" stop-color="#087A35"/>
    </linearGradient>
  </defs>
  <style>
    .wing {
      transform-box: fill-box;
      animation: wing-flap 420ms ease-in-out infinite alternate;
    }
    .wing-left {
      transform-origin: 100% 92%;
    }
    .wing-right {
      transform-origin: 0% 92%;
      animation-name: wing-flap-right;
      animation-delay: -90ms;
    }
    @keyframes wing-flap {
      from { transform: rotate(0deg); }
      45% { transform: rotate(11deg); }
      to { transform: rotate(-2deg); }
    }
    @keyframes wing-flap-right {
      from { transform: rotate(0deg); }
      45% { transform: rotate(-11deg); }
      to { transform: rotate(2deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .wing { animation: none; }
    }
  </style>
